<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#022c22" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded squircle background -->
  <rect width="128" height="128" rx="34" fill="url(#pawGrad)" filter="url(#shadow)"/>
  
  <!-- Crisp white pet paw -->
  <g fill="#ffffff">
    <!-- Main pad -->
    <path d="M64 63 C51 63, 43 75, 47 88 C50 97, 56 102, 64 102 C72 102, 78 97, 81 88 C85 75, 77 63, 64 63 Z" />
    <!-- Toe 1 -->
    <ellipse cx="37" cy="56" rx="9" ry="13" transform="rotate(-24 37 56)" />
    <!-- Toe 2 -->
    <ellipse cx="54" cy="45" rx="9.5" ry="14" transform="rotate(-8 54 45)" />
    <!-- Toe 3 -->
    <ellipse cx="74" cy="45" rx="9.5" ry="14" transform="rotate(8 74 45)" />
    <!-- Toe 4 -->
    <ellipse cx="91" cy="56" rx="9" ry="13" transform="rotate(24 91 56)" />
  </g>
</svg>
