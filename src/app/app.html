<div class="min-h-screen bg-slate-100 dark:bg-[#070c18] text-slate-800 dark:text-slate-100 flex flex-col font-sans selection:bg-emerald-500 selection:text-slate-950 relative overflow-x-hidden transition-colors duration-500">
  
  <!-- Liquid Ambient Vivid Glowing Blobs (Visible Through Glass) -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <!-- Top-Left Emerald/Teal Glow Orb -->
    <div class="absolute -top-36 -left-36 w-[36rem] h-[36rem] rounded-full bg-gradient-to-tr from-emerald-500/45 via-teal-400/35 to-cyan-400/30 blur-[120px] animate-blob-1"></div>
    
    <!-- Top-Right Indigo/Cyan Aurora Orb -->
    <div class="absolute top-10 -right-36 w-[34rem] h-[34rem] rounded-full bg-gradient-to-bl from-cyan-400/35 via-indigo-500/30 to-emerald-500/25 blur-[130px] animate-blob-2"></div>
    
    <!-- Center-Bottom Deep Lagoon Orb -->
    <div class="absolute -bottom-36 left-1/3 w-[42rem] h-[42rem] rounded-full bg-gradient-to-t from-teal-500/35 via-emerald-600/30 to-cyan-600/20 blur-[140px] animate-blob-1"></div>

    <!-- Soft Radial Mesh Vignette -->
    <div class="absolute inset-0 bg-radial from-transparent via-transparent to-slate-200/40 dark:to-[#04070e]/80"></div>
  </div>

  <!-- Floating Dynamic Island Navbar -->
  <div class="relative z-40">
    <app-navbar />
  </div>

  <!-- Main Content Routed with breathing space below floating navbar and above mobile dock -->
  <main class="flex-1 relative z-10 pt-20 sm:pt-24 pb-24 md:pb-12">
    <router-outlet />
  </main>

  <!-- Footer -->
  <footer class="relative z-10 py-6 border-t border-slate-200/60 dark:border-slate-800/60 bg-white/50 dark:bg-[#070c18]/60 backdrop-blur-xl text-center text-xs text-slate-500 dark:text-slate-400 transition-colors">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <p>© 2026 Registro de Mascotas Enterprise. Arquitectura Segura & Escalable.</p>
      <div class="flex items-center gap-4 text-[11px]">
        <span class="flex items-center gap-1.5 font-medium text-emerald-600 dark:text-emerald-400">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          API v1 Conectada
        </span>
        <span class="text-slate-400 dark:text-slate-600">|</span>
        <span class="font-medium text-slate-600 dark:text-slate-300">RBAC Activo</span>
      </div>
    </div>
  </footer>

  <!-- Modal Global Obligatorio si el usuario tiene una versión desactualizada del Aviso de Privacidad -->
  <app-privacy-modal
    [isOpen]="authService.needsPrivacyAcceptance()"
    [isMandatory]="true"
    (accepted)="onAcceptUpdatedPrivacy()"
  />

  <!-- Toasts -->
  <app-toast-container />
</div>
